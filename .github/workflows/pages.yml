name: Check and publish N-back
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 -B -m unittest discover -s scripts
      - run: python3 scripts/generate-audio.py --check
      - run: npm run check
      - name: Verify published dependency notices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = Path("dist/licenses/dependencies.md").read_text().split("\n## ")
          for package in ("react", "react-dom", "scheduler"):
              license_text = (Path("node_modules") / package / "LICENSE").read_text().strip()
              if not any(section.startswith(f"{package} - ") and license_text in section for section in sections):
                  raise SystemExit(f"Missing {package} license in dist")
          PY
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
